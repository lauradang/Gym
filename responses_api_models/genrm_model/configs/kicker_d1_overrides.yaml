# d1 (honest-dolphin) judge rewiring + reasoning-off cohort agent.
# Loaded LAST via NEMOGYM_EXTRA_CONFIG_PATHS: omegaconf deep-merges over the
# base server configs, so each block only carries the keys that change.
#
# README conformance (geshen grpo_ultra_512n4g_bf16.yaml judge-wiring
# overrides): abstention / lc_judge / equivalence_llm_judge / multichallenge /
# math_with_judge move from policy-as-judge (our v5-v7 topology) to the
# dedicated Qwen3-235B-FP8 judge (nl2bash_judge_model instance from
# kicker_d1_judges_remote.yaml), judge output capped at 8192 tokens.
# jailbreak_detection needs no override: its config already names
# safety_judge_model, which the judges_remote file now provides.
abstention:
  resources_servers:
    abstention:
      judge_model_server:
        type: responses_api_models
        name: nl2bash_judge_model
      judge_responses_create_params:
        max_output_tokens: 8192

lc_judge:
  resources_servers:
    equivalence_llm_judge:
      judge_model_server:
        type: responses_api_models
        name: nl2bash_judge_model
      judge_responses_create_params:
        max_output_tokens: 8192

equivalence_llm_judge:
  resources_servers:
    equivalence_llm_judge:
      judge_model_server:
        type: responses_api_models
        name: nl2bash_judge_model
      judge_responses_create_params:
        max_output_tokens: 8192

multichallenge:
  resources_servers:
    multichallenge:
      judge_model_server:
        type: responses_api_models
        name: nl2bash_judge_model
      judge_responses_create_params:
        max_output_tokens: 8192

math_with_judge:
  resources_servers:
    math_with_judge:
      should_use_judge: true
      judge_model_server:
        type: responses_api_models
        name: nl2bash_judge_model
      judge_responses_create_params:
        max_output_tokens: 8192

# The reasoning-off genrm cohort agent (upstream genrm_compare.yaml:118 shape),
# re-declared here so we don't have to load the upstream file (whose
# genrm_compare_resources_server block would fight kicker_genrm_compare.yaml).
genrm_simple_agent_reasoning_off:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: genrm_compare_resources_server
      model_server:
        type: responses_api_models
        name: policy_model_reasoning_off
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/genrm_compare/data/example.jsonl
